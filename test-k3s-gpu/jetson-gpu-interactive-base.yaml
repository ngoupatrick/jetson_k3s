apiVersion: v1
kind: Namespace
metadata:
  name: jetson-base 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfsclaim
  namespace: jetson-base
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-usb1
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: jetson-gpu-interactive-base
  namespace: jetson-base
spec:
  hostNetwork: true
  containers:
  - name: ai-container
    image: picomaster:30500/jetson-base:v1
    #command: ["sleep", "infinity"]
    command: ["/bin/bash", "-c"]
    args:
      - |        
        # 1. Mise à jour du cache LD pour inclure le dossier CUDA monté
        ldconfig /usr/local/cuda-10.2/lib64
        echo "**Configuration terminée et Cache LD mis à jour.**"
        
        # 2. Maintien du Pod en vie
        sleep infinity
    securityContext:
      privileged: true
    env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: all
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: all,utility,compute,video,graphics
    - name: LD_LIBRARY_PATH
      value: "/usr/local/cuda-10.2/lib64"
    resources:
      limits:
        nvidia.com/gpu: 1
    volumeMounts:
    - name: cuda-volume
      mountPath: /usr/local/cuda-10.2
      readOnly: true
    - name: nfs-volume
      mountPath: /data
  volumes:
  - name: cuda-volume
    hostPath:
      path: /usr/local/cuda-10.2
      type: Directory
  - name: nfs-volume
    persistentVolumeClaim:
      claimName: nfsclaim
  restartPolicy: Never
