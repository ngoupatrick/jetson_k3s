auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 72h # Rejette les vieux logs (3j)
  retention_period: 72h           # Garde les logs 72 heures seulement

table_manager:
  retention_deletes_enabled: true
  retention_period: 72h           # Active la suppression automatique après 72h

schema_config:
  configs:
    - from: "2026-04-14"         # Date passée pour une nouvelle installation
      store: tsdb               # Utilise le moteur TSDB (recommandé pour v3.x)
      object_store: filesystem  # Stockage local des fichiers
      schema: v13               # Version de schéma pour Loki 3.x
      index:
        prefix: index_
        period: 24h             # Rotation des index toutes les 24h
