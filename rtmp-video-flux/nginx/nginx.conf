# /etc/nginx/nginx.conf
worker_processes auto;
rtmp_auto_push on;
events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;   

        # Optimisation de la taille des paquets pour réduire la latence
        chunk_size 4096; 

        application live {
            live on;
            record off;

            # --- AJUSTEMENTS POUR LE CLUSTER K3S (picoworker) ---
            
            # Force l'envoi des informations de codec (SPS/PPS) à MediaMTX
            # Cela corrige l'erreur "received a packet for video track 0"
            interleave on;
            
            # Envoie les métadonnées (taille, fps, profil) au nœud picomaster
            meta on;
            
            # Ne commence l'envoi du flux que sur une image clé (I-Frame)
            # Évite les artefacts visuels au démarrage sur picoworker
            wait_key on;
            wait_video on;            
        }
    }
}
