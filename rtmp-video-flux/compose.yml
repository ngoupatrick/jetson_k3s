name: jetson-video

services:
  nginx-rtmp:
    image: tiangolo/nginx-rtmp
    container_name: nginx-rtmp
    hostname: nginx-rtmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/stat"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "1935:1935"   # Port RTMP pour le streaming
      - "8060:80"     # Port optionnel pour voir les statistiques (si activé)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    networks:
      - jetson-video

networks:
  jetson-video:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: video_bridge

