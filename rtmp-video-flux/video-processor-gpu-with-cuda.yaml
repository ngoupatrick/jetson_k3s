apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor-gpu-with-cuda
  namespace: media
spec:
  replicas: 1 # Un sur S1, un sur S2 (si disponible)
  selector:
    matchLabels:
      app: video-processor
  template:
    metadata:
      labels:
        app: video-processor
    spec:
      #nodeSelector:
      #  hardware: "gpu" # Utilise les labels définis lors de l'install K3s
      hostNetwork: true
      containers:
      - name: processor
        image: picomaster:30500/gpu-processor:with-cuda
        command: ["sleep", "infinity"] # Empêche le CrashLoop (FOR TEST)
        #command: ["/bin/bash", "-c"]
        #args:
        #  - |
        #    python3 /mnt/yolo/scripts/processor-with-cuda.py
        securityContext:
          privileged: true
        env:
        #- name: LD_LIBRARY_PATH
        #  value: "/usr/lib/aarch64-linux-gnu/tegra"
        - name: RTSP_URL # On peut utiliser RTSP même si la source est RTMP
          value: "rtsp://mediamtx-service:8554/host_stream"
        - name: MODEL_PATH # Path vers le modèle YOLO sur le NFS
          value: "/mnt/yolo/models/yolov8n.pt"
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "2500Mi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        volumeMounts:
          - name: yolo-volume
            mountPath: /mnt/yolo
        #- name: tegra-libs
        #  mountPath: /usr/lib/aarch64-linux-gnu/tegra
      volumes:
      - name: yolo-volume
        nfs:
          server: picomaster
          path: /k3s-ext-1/yolo
      #- name: tegra-libs
      #  hostPath:
      #    path: /usr/lib/aarch64-linux-gnu/tegra
      #restartPolicy: Never
