apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: v1
kind: Service
metadata:
  name: chat-ollama-gpu-service 
  namespace: ollama
spec:
  selector:
    app: chat-ollama-gpu
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ollama-gpu
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-ollama-gpu
  template:
    metadata:
      labels:
        app: chat-ollama-gpu
    spec:
      nodeSelector:
        hardware: "gpu"
      hostNetwork: true
      hostIPC: true
      containers:
      - name: chat-ollama-gpu
        image: ollama/ollama:0.1.32
        ports:
        - containerPort: 11434
        securityContext:
          privileged: true
          # today
          capabilities:
            add: ["SYS_RAWIO", "IPC_LOCK"] # Ajoute des droits bas-niveau
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        # On force le chemin vers les libs Tegra et CUDA 10.2
        - name: LD_LIBRARY_PATH
          value: "/usr/lib/aarch64-linux-gnu/tegra:/usr/local/cuda-10.2/lib64:/usr/lib/aarch64-linux-gnu"
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all,utility,compute,video,graphics
        resources:
          requests:
            memory: "1024Mi"
            cpu: "500m"
          limits:
            #nvidia.com/gpu: 1 # Nécessite le NVIDIA Device Plugin
            memory: "3000Mi"
        volumeMounts:
        - name: tegra-libs
          mountPath: /usr/lib/aarch64-linux-gnu/tegra
        - name: cuda-volume
          mountPath: /usr/local/cuda-10.2
          readOnly: true
        - name: ollama-volume
          mountPath: /root/.ollama
      volumes:
      - name: tegra-libs
        hostPath:
          path: /usr/lib/aarch64-linux-gnu/tegra
      - name: cuda-volume
        hostPath:
          path: /usr/local/cuda-10.2
          type: Directory
      - name: ollama-volume
        nfs:
          server: picomaster
          path: /k3s-ext-1/chat
      #restartPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-ui
  template:
    metadata:
      labels:
        app: chat-ui
    spec:
      containers:
      - name: chat-ui
        image: ghcr.io/open-webui/open-webui:main-slim
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "300Mi"
          limits:
            memory: "2000Mi" # L'UI peut être gourmande au chargement
        env:
        - name: OLLAMA_BASE_URL
          value: "http://chat-ollama-gpu-service:11434" # We use service name to connect to the Ollama container
---
apiVersion: v1
kind: Service
metadata:
  name: chat-ui-public
  namespace: ollama
spec:
  type: NodePort
  selector:
    app: chat-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
