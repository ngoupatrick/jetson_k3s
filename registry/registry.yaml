apiVersion: v1
kind: Namespace
metadata:
  name: registry 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-pvc
  namespace: registry # On le met souvent ici ou dans un namespace dédié
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-usb2 # Utilise votre 2ème clé USB
  resources:
    requests:
      storage: 12Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            # Enable deletion of images via API
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            # Set log level for debugging
            - name: REGISTRY_LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "2.5Gi"
          # Health check ensures the registry is responding
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: registry-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: registry-service
  namespace: registry
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - port: 5000 # Le port interne a k3s du Service (pod to pod com)
      targetPort: 5000 # Le port du Conteneur (app is running on inside container)
      nodePort: 30500 # Port pour accéder au registre depuis tous les noeuds du cluster
